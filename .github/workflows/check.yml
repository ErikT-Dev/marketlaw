name: Check

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Keep the harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: harness/report.html
          if-no-files-found: warn

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare the local database
        run: npm run db:migrate:local

      - name: Make a test room secret, Turnstile test keys and the test site game limit for the local server
        run: |
          echo "TEST_ROOM_SECRET=$(openssl rand -hex 24)" > .dev.vars
          echo "TURNSTILE_SITE_KEY=1x00000000000000000000AA" >> .dev.vars
          echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA" >> .dev.vars
          echo "TEST_SITE_GAMES_PER_DAY=1000000" >> .dev.vars

      - name: Browser tests
        run: npm run e2e

      - name: Keep the browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
