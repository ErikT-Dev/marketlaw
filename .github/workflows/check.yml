name: Check

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Keep the harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: harness/report.html
          if-no-files-found: warn
