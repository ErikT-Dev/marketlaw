name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "tools/hooks/**"
      - ".claude/**"
      - "harness/screens/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tested:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      already-tested: ${{ steps.find.outputs.already-tested }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Find a passed Check run of the same code
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          already_tested=false
          if branch_head=$(git rev-parse --verify --quiet HEAD^2) &&
            [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$branch_head^{tree}")" ] &&
            [ "$(gh run list --workflow Check --commit "$branch_head" --json conclusion --jq "map(select(.conclusion == \"success\")) | length")" != "0" ]; then
            already_tested=true
          fi
          echo "Merged code already passed Check: $already_tested"
          echo "already-tested=$already_tested" >> "$GITHUB_OUTPUT"

  check:
    needs: tested
    if: needs.tested.outputs.already-tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  browser-tests:
    needs: tested
    if: needs.tested.outputs.already-tested != 'true'
    name: browser-tests (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: full games, 2 players
            tests: --grep "two players play a whole game from the lobby"
          - part: full games, 3 players
            tests: --grep "three players play a whole game from the lobby"
          - part: full games, 4 players
            tests: --grep "four players play a whole game from the lobby"
          - part: other tests 1 of 3
            tests: --grep-invert "play a whole game from the lobby" --shard=1/3
          - part: other tests 2 of 3
            tests: --grep-invert "play a whole game from the lobby" --shard=2/3
          - part: other tests 3 of 3
            tests: --grep-invert "play a whole game from the lobby" --shard=3/3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium, each try stopped after 4 minutes, at most 3 tries
        timeout-minutes: 13
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=10s 4m npx playwright install chromium; then
              exit 0
            fi
            echo "Chromium install try $attempt did not finish"
          done
          exit 1

      - name: Prepare the local database
        run: npm run db:migrate:local

      - name: Make a test room secret, Turnstile test keys and the test site game, chat and email limits for the local server
        run: |
          echo "TEST_ROOM_SECRET=$(openssl rand -hex 24)" > .dev.vars
          echo "TURNSTILE_SITE_KEY=1x00000000000000000000AA" >> .dev.vars
          echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA" >> .dev.vars
          echo "TEST_SITE_GAMES_PER_DAY=1000000" >> .dev.vars
          echo "TEST_SITE_CHAT_MESSAGES_PER_DAY=1000000" >> .dev.vars
          echo "TEST_SITE_EMAILS_PER_DAY=1000000" >> .dev.vars

      - name: Browser tests
        timeout-minutes: 15
        run: npm run e2e -- --reporter=list ${{ matrix.tests }}

      - name: Keep the browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results (${{ matrix.part }})
          path: test-results/
          if-no-files-found: ignore

  deploy:
    needs: [tested, check, browser-tests]
    if: >-
      !cancelled() && needs.tested.result == 'success' &&
      (needs.tested.outputs.already-tested == 'true' ||
      (needs.check.result == 'success' && needs.browser-tests.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7a3255cbf535b7dfa4ab4ec6e9e451e3
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Apply database migrations
        run: npm run db:migrate:remote

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
