name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tested:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      already-tested: ${{ steps.find.outputs.already-tested }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Find a passed Check run of the same code
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          already_tested=false
          if branch_head=$(git rev-parse --verify --quiet HEAD^2) &&
            [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$branch_head^{tree}")" ] &&
            [ "$(gh run list --workflow Check --commit "$branch_head" --json conclusion --jq "map(select(.conclusion == \"success\")) | length")" != "0" ]; then
            already_tested=true
          fi
          echo "Merged code already passed Check: $already_tested"
          echo "already-tested=$already_tested" >> "$GITHUB_OUTPUT"

  check:
    needs: tested
    if: needs.tested.outputs.already-tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  browser-tests:
    needs: tested
    if: needs.tested.outputs.already-tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare the local database
        run: npm run db:migrate:local

      - name: Make a test room secret for the local server
        run: echo "TEST_ROOM_SECRET=$(openssl rand -hex 24)" > .dev.vars

      - name: Browser tests
        run: npm run e2e

  deploy:
    needs: [tested, check, browser-tests]
    if: >-
      !cancelled() && needs.tested.result == 'success' &&
      (needs.tested.outputs.already-tested == 'true' ||
      (needs.check.result == 'success' && needs.browser-tests.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7a3255cbf535b7dfa4ab4ec6e9e451e3
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Apply database migrations
        run: npm run db:migrate:remote

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
