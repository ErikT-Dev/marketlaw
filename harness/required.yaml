scenarios:
  hostile-client:
    - rejects a message that cannot be read
    - rejects a message with a missing field
    - rejects an unknown action
    - rejects a message with an old protocol version
    - rejects a forged player token
    - a room code is not proof of identity
    - rejects an action based on an older state version
    - a repeated action id returns the original result and changes nothing more
    - rejects an action from a player who is not in the game
    - a connection that sends 30 rejected messages within a minute is closed
    - rejects selling a card another player holds
    - rejects selling the same card twice in one message
    - another player's hidden action does not change my state version
    - rejects a main-phase action during the market phase
    - rejects any action after the game has ended
  combos-and-income:
    - a card-name combo is claimed when the named card is in the city
    - a card-name combo works whichever card was played first
    - a card-name combo does not count another player's city
    - a type-count combo is claimed once
    - claim all claims an infinite combo as many times as the type count allows
    - an infinite combo already claimed is claimed again at the next multiple
    - types gained from quests count for type combos
    - rejects claim all when no combo is ready
    - an infinite combo with a count of 1 is claimed once for every count
    - income happens by itself when product and distribution are both there and no stat is negative
    - no income while a stat is negative
    - no income with product but no distribution
    - income repeats as long as it is possible
    - a card drawn in the main phase is marked new
  drawing:
    - if a tier is empty the nearest other tier is used and the lower one first
    - tier 3 falls back to tier 2 before tier 1
    - if the whole sector is gone the top card of the deck is drawn
    - with an empty deck the discard pile is shuffled in before the top card is drawn
    - with no cards left at all nothing is drawn
    - main-phase draws do not use cards sold in the same main phase
    - a random draw in turn 13 asks for a sector and then a tier
    - from turn 27 every tier-by-turn draw is tier 3 and no tier is asked for
    - other players see only the sector and tier asked for when a fallback is used
    - a draw takes the first card of that sector and tier from the top of the deck
    - if the deck has none the discard pile cards of that sector and tier are shuffled in
    - a discard shuffle in the main phase is shown to others only when the phase ends
    - the player who caused a discard shuffle sees it straight away
    - turn draws use the number of the turn that is starting
  playing-cards:
    - playing a Residential card pays its cost and applies its stats and types
    - playing an Industry card gives product and uses workforce quality and satisfaction
    - playing a Service card gives distribution
    - playing a Public card gives quality and satisfaction and uses workforce
    - a card that counts a type twice adds 2 to that type count
    - real cost adds 1 for each card of the same sector and tier already in the city
    - cards of another tier do not raise the real cost
    - rejects a card the player cannot afford at its real cost
    - rejects a tier 2 card before turn 5
    - a tier 2 card can be played from turn 5
    - rejects a second card in a turn without a build pass
    - a build pass allows a second card and is used up
    - rejects playing a card after skip build even with a build pass
    - rejects a card that is not in the hand
    - selling several cards is one action and puts them in the holding pile
    - rejects any action after the 50th main-phase action but still allows ending the turn
    - a player at the action limit can end their turn
    - undo counts toward the action limit
    - sold cards join the discard pile when the main phase ends
  projects:
    - completing a project uses up 8 of the stat and gives income funds influence and a card
    - rejects a project without enough of the stat
    - rejects a project while another stat is negative
    - rejects completing the same project twice
    - the third project gives an extra income and an extra card
    - everyone who completes a project in the first turn anyone does gets 2 extra funds at the end of the turn
    - a project completed in a later turn gives no first-completion funds
    - rejects a project outside the main phase
  setup:
    - a new game gives every player the starting stats and time bank
    - starting hands are dealt from the top of the deck one player at a time in seat order
    - the marketplace is filled after the hands in the fixed place order
    - the quests table starts with 4 random tier 1 quests and 2 different bonus types are picked
    - after setup the deck holds every card not dealt or on display
    - turn 1 starts with the main phase and every player can act
  turns-and-time:
    - ending the turn marks the player done and further actions are rejected
    - the main phase ends only when every player is done
    - the order in which players become done is recorded
    - end-of-turn steps pay influence income and bonus and keep build passes
    - negative stats lower the bonus and a negative bonus gives no funds
    - every full 10 bonus becomes 1 fund
    - players who left get no end-of-turn steps
    - skip build is reset at the end of the turn
    - the first player moves one seat on each turn
    - the first player in turn 3 of a 3-player game is seat 3
    - if the first player has left the next seat still in the game goes first
    - player order wraps from the highest seat to seat 1 and skips players who left
    - at the start of a turn old marketplace cards are removed and places refilled in order
    - the market phase follows the start-of-turn steps
    - a 5th quest place is added and filled at the start of turn 20
    - players made done at the same moment become done in player order
    - the main-phase time limit in turn 10 is 3 minutes 57 seconds
    - reaching the main-phase limit makes the player done
    - the first 45 seconds of a main phase do not use the time bank
    - the time bank runs after the free time until the player ends their turn
    - with an empty bank a player only has the free time
    - a message received at the deadline is rejected and the time-out is applied
    - a message received just before the deadline is accepted
    - banks are shown rounded down to whole seconds
    - "every player sees every other player's bank counting down during the main phase"
    - a player whose time runs out is told how many time-outs in a row out of 3
    - ending the turn in time resets the time-out count
    - "the first player's market go has 45 seconds"
    - other market goes have 30 seconds
  visibility:
    - other players' hands are shown only as a number of cards
    - a player sees their own hand
    - another player's main-phase actions stay hidden until the phase ends
    - whether another player is done is shown during the main phase
    - main-phase actions are revealed when the main phase ends
    - no player receives the random seed or the deck order
    - undone actions are never shown to other players
    - the deck count shown during the main phase leaves out other players' draws
    - a player's own draws are shown in their deck count straight away
    - the draw log shows who drew how many and what was asked for but not the card
    - a marketplace card taken is known to be in that player's hand
    - a card I drew that another player's hidden shuffle left in my discard pile is taken off that pile
  influence:
    - 4 influence buys 2 funds once per game
    - 4 influence buys 1 quality
    - 4 influence buys 1 satisfaction
    - 6 influence buys 1 workforce
    - 1 fund buys 1 influence any number of times
    - a bought build pass costs 1 more fund each time
    - 5 influence buys 1 build pass once per game
    - skip build gives a build pass and blocks playing cards this turn
    - skip build is rejected after playing a card this turn
    - skip build can be used 3 times per game
    - 1 influence and 1 quality buy 1 satisfaction
    - 1 influence and 1 satisfaction buy 1 quality
    - 2 influence and 1 product buy 1 distribution and 1 satisfaction
    - 2 influence 1 distribution and 1 satisfaction buy 1 product
    - 2 influence and 1 quality buy 1 workforce
    - 2 influence and 1 satisfaction buy 1 workforce
    - 1 workforce buys 1 satisfaction once per game
    - 1 workforce buys 1 quality
    - 2 quality buy 1 satisfaction any number of times
    - 2 satisfaction buy 1 quality
    - 4 quality buy 1 workforce
    - 4 satisfaction buy 1 workforce
    - rejects a trade the player cannot afford
    - 3 influence draw a tier 1 card of a chosen kind
    - 4 influence draw a tier 2 card of a chosen kind
    - 5 influence draw a tier 3 card of a chosen kind
    - a draw action for a Public kind draws only that kind
    - rejects a draw action when no card of that kind and tier is left
    - a draw action whose last card another player took this phase gives another tier
  undo:
    - undo takes back playing a card
    - undo takes back claim all
    - undo takes back a trade that draws no card
    - undo takes back skip build and the build pass it gave
    - undo takes back the latest action first
    - selling cannot be undone
    - completing a project cannot be undone
    - a draw action cannot be undone
    - playing a card that triggers income cannot be undone because income draws a card
    - nothing before an action that cannot be undone can be undone
    - rejects undo when there is nothing to undo
    - undo is only for the player's own actions
    - undoing a card played with a build pass gives the pass back
    - undoing a bought build pass makes the next one cost the same again
    - undo takes back completing a quest whose reward draws no card
    - completing a quest whose reward draws a card cannot be undone
  marketplace:
    - option A takes a free market card and draws one card of the same sector from the deck
    - option B draws 2 cards of a chosen sector from the deck
    - a player whose market go comes with an empty marketplace must take option B
    - rejects a market action when it is another player's go
    - rejects a second market go in the same turn
    - rejects taking a card that is not in the marketplace
    - after the last marketplace card is taken the next player still gets their market go
    - the market phase ends when every player has had their market go
    - new marks last until the end of the turn
    - a kind place with no card of its kind left stays empty
    - a kind place falls back to another tier of its kind
    - option A with no cards left of that sector draws the top card of the deck
    - a time-out on the market go takes option B with a random sector
    - the market time beyond the first 5 seconds of a go comes from the bank
  quests:
    - rejects a quest whose requirement is not met
    - a requirement means at least that amount and nothing is used up
    - rejects completing the same quest twice
    - rejects a quest that is not on the table
    - rejects completing a quest outside the main phase
    - several players can complete the same quest in the same turn
    - a completed quest leaves the table for good and the place is refilled next turn
    - a quest nobody completed in 5 turns goes back into the quest list
    - a tier 2 quest picked before turn 5 is replaced by a tier 1 quest
    - a tier 3 quest picked before turn 13 is replaced by the nearest allowed tier
    - a tier with no quests left falls back to the nearest tier with quests the lower one first
    - with no quests left in the list empty places stay empty
    - sector counts count only cards in the city
    - a gained type is not a card and does not count for sector counts
    - a type gained from one quest helps complete another
    - completing Working district gives its reward
    - completing Farming industry gives its reward
    - completing Local services gives its reward
    - completing Green city gives its reward
    - completing Countryside gives its reward
    - completing Farmland gives its reward
    - completing Fishing village gives its reward
    - completing Sports town gives its reward
    - completing High street gives its reward
    - completing Mining town gives its reward
    - "completing Workers' housing gives its reward"
    - completing Tidy streets gives its reward
