- name: 4 influence buys 2 funds once per game
  covers: [R15.1]
  given:
    seats:
      - seat: 1
        stats: {influence: 8}
  when:
    - {seat: 1, action: influence, trade: influence_to_funds}
    - {seat: 1, action: influence, trade: influence_to_funds}
  then:
    rejected: trade_limit_reached
    seats:
      - seat: 1
        stats: {funds: 9, influence: 4}
        influence_uses: {influence_to_funds: 1}

