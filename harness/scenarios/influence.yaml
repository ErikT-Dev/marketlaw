- name: rejects a trade the player cannot afford
  covers: [R15.1]
  given:
    seats:
      - seat: 1
        stats: {influence: 3}
  when:
    - {seat: 1, action: influence, trade: influence_to_funds}
  then:
    rejected: cannot_afford_trade
    unchanged: true

- name: 3 influence draw a tier 1 card of a chosen kind
  covers: [R15.1, R15.2, R15.3, R3.7]
  given:
    seats:
      - seat: 1
        stats: {influence: 3}
  when:
    - {seat: 1, action: influence, trade: draw_tier_1, kind: Residential}
  then:
    seats:
      - seat: 1
        stats: {influence: 0}
        hand: [Farm House]

