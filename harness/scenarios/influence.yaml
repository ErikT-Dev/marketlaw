  when:
    - {seat: 1, action: influence, trade: draw_tier_1, kind: Public satisfaction card}
  then:
    seats:
      - seat: 1
        hand: [Public Playground]

- name: rejects a draw action when no card of that kind and tier is left
  covers: [R15.3]
  given:
    deck: [Pub, Library]
    discard: [Orchard]
    seats:
      - seat: 1
        stats: {influence: 3}
  when:
    - {seat: 1, action: influence, trade: draw_tier_1, kind: Residential}
  then:
    rejected: no_card_of_kind
    unchanged: true

- name: a draw action whose last card another player took this phase gives another tier
  covers: [R15.3, R15.4, R17.4]
  given:
    deck: [Row House, Dorm, Pub]
    seats:
      - seat: 1
        stats: {influence: 3}
      - seat: 2
        stats: {influence: 3}
  when:
    - {seat: 2, action: influence, trade: draw_tier_1, kind: Residential}
    - {seat: 1, action: influence, trade: draw_tier_1, kind: Residential}
  then:
    seats:
      - seat: 1
        stats: {influence: 0}
        hand: [Dorm]
      - seat: 2
        hand: [Row House]

- name: a bought build pass can be used straight away
  covers: [R15.1, R6.3]
  given:
    seats:
      - seat: 1
        stats: {funds: 10}
        build_passes: 0
        played_this_turn: true
        hand: [Orchard]
  when:
    - {seat: 1, action: influence, trade: buy_build_pass}
    - {seat: 1, action: play_card, card: Orchard}
  then:
    seats:
      - seat: 1
        stats: {funds: 4}
        build_passes: 0
        city: [Orchard]

- name: funds received and cards drawn add to total worth gained
  covers: [R2.4]
  given:
    seats:
      - seat: 1
        stats: {influence: 7}
  when:
    - {seat: 1, action: influence, trade: influence_to_funds}
    - {seat: 1, action: influence, trade: draw_tier_1, kind: Residential}
  then:
    seats:
      - seat: 1
        stats: {funds: 9, influence: 0}
        hand: [Farm House]
        worth_gained: 17
