- name: other players' hands are shown only as a number of cards
  covers: [M3.2, M3.5]
  given:
    seats:
      - seat: 1
        hand: [Row House, Pub]
  then:
    view: {seat: 2, of_seat: 1, hand_count: 2, hides: [Row House, Pub]}

- name: a player sees their own hand
  covers: [M3.2]
  given:
    seats:
      - seat: 1
        hand: [Row House, Pub]
  then:
    view: {seat: 1, of_seat: 1, hand: [Row House, Pub]}

- name: another player's main-phase actions stay hidden until the phase ends
  covers: [R5.4, M3.2]
  given:
    seats:
      - seat: 1
        hand: [Row House]
  when:
    - {seat: 1, action: play_card, card: Row House}
  then:
    view: {seat: 2, of_seat: 1, city: [], stats: {funds: 7}, hand_count: 1}

- name: whether another player is done is shown during the main phase
  covers: [R5.4]
  when:
    - {seat: 1, action: end_turn}
  then:
    view: {seat: 2, of_seat: 1, done: true}

- name: main-phase actions are revealed when the main phase ends
  covers: [R5.4]
  given:
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    seats:
      - seat: 1
        hand: [Small Home]
  when:
    - {seat: 1, action: play_card, card: Small Home}
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    view: {seat: 2, of_seat: 1, city: [Small Home]}

- name: undone actions are never shown to other players
  covers: [R5.7]
  given:
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    seats:
      - seat: 1
        hand: [Small Home]
  when:
    - {seat: 1, action: play_card, card: Small Home}
    - {seat: 1, action: undo}
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    view: {seat: 2, of_seat: 1, city: [], log_excludes: [Small Home]}

- name: the deck count shown during the main phase leaves out other players' draws
  covers: [R5.5]
  given:
    seats:
      - seat: 1
        stats: {influence: 3}
  when:
    - {seat: 1, action: influence, trade: draw_tier_1, kind: Residential}
  then:
    view: {seat: 2, deck_count: 240}
    deck_count: 239

- name: a player's own draws are shown in their deck count straight away
  covers: [R5.5]
  given:
    seats:
      - seat: 1
        stats: {influence: 3}
  when:
    - {seat: 1, action: influence, trade: draw_tier_1, kind: Residential}
  then:
    view: {seat: 1, deck_count: 239}

- name: the draw log shows who drew how many and what was asked for but not the card
  covers: [M3.3, M3.4]
  given:
    turn: 2
    phase: market
    first_player: 2
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    random: [{tier: 1}, {tier: 1}]
  when:
    - {seat: 2, action: turn_draw, option: B, sector: Service}
  then:
    view: {seat: 1, log_contains: [{seat: 2, turn_draw: B, sector: Service, drew: 2, tier: 1}], hides: [Fast Food Restaurant, Pub]}

- name: a marketplace card taken is known to be in that player's hand
  covers: [M3.3]
  given:
    turn: 2
    phase: market
    first_player: 2
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    random: [{tier: 1}]
  when:
    - {seat: 2, action: turn_draw, option: A, card: Row House}
  then:
    view: {seat: 1, of_seat: 2, known_in_hand: [Row House], hand_count: 2, hides: [Farm House]}

- name: everything about another player except the hand is public
  covers: [M3.5]
  given:
    seats:
      - seat: 1
        stats: {funds: 9, income: 5, influence: 2, workforce: 1, quality: 2, satisfaction: 3, product: 1, distribution: 0, bonus: 4}
        city: [Row House]
        build_passes: 1
        influence_uses: {influence_to_funds: 1}
        projects: [quality]
        quests_completed: [Farmland]
        time_bank_ms: 600000
  then:
    view: {seat: 2, of_seat: 1, stats: {funds: 9, income: 5, influence: 2, workforce: 1, quality: 2, satisfaction: 3, product: 1, distribution: 0, bonus: 4}, city: [Row House], type_counts: {Town Housing: 1}, build_passes: 1, influence_uses: {influence_to_funds: 1}, projects: [quality], quests_completed: [Farmland], time_bank_ms: 600000, away: false}

- name: no player receives the random seed or the deck order
  covers: [M3.2, M4.1]
  given:
    phase: new_game
    players: 2
    random: [{sector: Industry}, {sector: Service}, {tier: 2}, {sector: Public}, {tier: 3}, {sector: Residential}, {sector: Residential}, {tier: 1}, {sector: Industry}, {tier: 1}, {sector: Service}, {sector: Service}, {sector: Industry}, {quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}, {type: Retail}, {type: Safety}]
  when:
    - start_game
  then:
    view: {seat: 1, hides: [seed, deck_order]}

- name: the replay record is kept for 30 days after the game ends
  covers: [M4.3]
  given:
    room: {code: K7QR2P, size: 2, public: true, players: [], state: ended, ended_ms: 0}
  when:
    - wait_ms: 2591999000
  then:
    replay_record: kept

- name: the replay record is removed after 30 days
  covers: [M4.3]
  given:
    room: {code: K7QR2P, size: 2, public: true, players: [], state: ended, ended_ms: 0}
  when:
    - wait_ms: 2592000000
  then:
    replay_record: removed
