- name: a new game gives every player the starting stats and time bank
  covers: [R2.1, R2.2, R9.3, R4.2]
  given:
    phase: new_game
    players: 3
    random: [{sector: Industry}, {sector: Service}, {tier: 2}, {sector: Public}, {tier: 3}, {sector: Residential}, {sector: Residential}, {tier: 1}, {sector: Industry}, {tier: 1}, {sector: Service}, {sector: Public}, {tier: 1}, {sector: Residential}, {tier: 1}, {sector: Service}, {sector: Service}, {sector: Industry}, {quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}, {type: Retail}, {type: Safety}]
  when:
    - start_game
  then:
    turn: 1
    phase: main
    seats:
      - seat: 1
        stats: {funds: 7, income: 3, influence: 0, workforce: 0, quality: 0, satisfaction: 0, product: 0, distribution: 0, bonus: 0}
        time_bank_ms: 900000
      - seat: 2
        stats: {funds: 7, income: 3, influence: 0, workforce: 0, quality: 0, satisfaction: 0, product: 0, distribution: 0, bonus: 0}
        time_bank_ms: 900000
      - seat: 3
        stats: {funds: 7, income: 3, influence: 0, workforce: 0, quality: 0, satisfaction: 0, product: 0, distribution: 0, bonus: 0}
        time_bank_ms: 900000

- name: starting hands are dealt from the top of the deck one player at a time in seat order
  covers: [R17.9, R4.6, R17.4]
  given:
    phase: new_game
    players: 2
    random: [{sector: Industry}, {sector: Service}, {tier: 2}, {sector: Public}, {tier: 3}, {sector: Residential}, {sector: Residential}, {tier: 1}, {sector: Industry}, {tier: 1}, {sector: Service}, {sector: Service}, {sector: Industry}, {quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}, {type: Retail}, {type: Safety}]
  when:
    - start_game
  then:
    seats:
      - seat: 1
        hand: [Farm House, Timber Harvesting Industry, Fast Food Restaurant, Landfill, Livestock Farm, Law Firm, City Hall]
      - seat: 2
        hand: [Cottage, Windmill Park, Pub, Trauma Center, Log House, Small Home, Sand and Gravel Pits]

- name: the marketplace is filled after the hands in the fixed place order
  covers: [R18.5, R18.1, R18.2, R18.4, R4.6]
  given:
    phase: new_game
    players: 2
    random: [{sector: Industry}, {sector: Service}, {tier: 2}, {sector: Public}, {tier: 3}, {sector: Residential}, {sector: Residential}, {tier: 1}, {sector: Industry}, {tier: 1}, {sector: Service}, {sector: Service}, {sector: Industry}, {quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}, {type: Retail}, {type: Safety}]
  when:
    - start_game
  then:
    marketplace:
      - {place: residential, card: Row House}
      - {place: industry, card: Metal Mining}
      - {place: service, card: Liquor Shop}
      - {place: public_quality, card: Fire Station}
      - {place: public_satisfaction, card: Public Playground}
      - {place: open_1, card: Dentist}
      - {place: open_2, card: Apparel Store}
      - {place: open_3, card: Forest Plantation}

- name: the quests table starts with 4 random tier 1 quests and 2 different bonus types are picked
  covers: [R19.3, R21.6, R4.6]
  given:
    phase: new_game
    players: 2
    random: [{sector: Industry}, {sector: Service}, {tier: 2}, {sector: Public}, {tier: 3}, {sector: Residential}, {sector: Residential}, {tier: 1}, {sector: Industry}, {tier: 1}, {sector: Service}, {sector: Service}, {sector: Industry}, {quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}, {type: Retail}, {type: Safety}]
  when:
    - start_game
  then:
    quests: [{quest: Farmland, turns_on_table: 1}, {quest: Sports town, turns_on_table: 1}, {quest: Trading post, turns_on_table: 1}, {quest: Mining town, turns_on_table: 1}]
    bonus_types: [Retail, Safety]

- name: after setup the deck holds every card not dealt or on display
  covers: [R17.1, R3.1]
  given:
    phase: new_game
    players: 2
    random: [{sector: Industry}, {sector: Service}, {tier: 2}, {sector: Public}, {tier: 3}, {sector: Residential}, {sector: Residential}, {tier: 1}, {sector: Industry}, {tier: 1}, {sector: Service}, {sector: Service}, {sector: Industry}, {quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}, {type: Retail}, {type: Safety}]
  when:
    - start_game
  then:
    deck_count: 218
    discard: []

- name: turn 1 starts with the main phase and every player can act
  covers: [R4.2, R1.4]
  given:
    turn: 1
    phase: main
    seats:
      - seat: 1
        hand: [Row House]
      - seat: 2
        hand: [Small Home]
  when:
    - {seat: 1, action: play_card, card: Row House}
    - {seat: 2, action: play_card, card: Small Home}
  then:
    seats:
      - seat: 1
        city: [Row House]
      - seat: 2
        city: [Small Home]
