- name: a player who left is placed below the players who stayed for ratings
  covers: [A10.8, A10.10]
  given:
    kind: ranked
    players: 3
    seats:
      - seat: 1
        player: Ann
      - seat: 2
        player: Bea
      - seat: 3
        player: Cat
    accounts: [{name: Ann, rating: 1000, ranked_games: 0}, {name: Bea, rating: 1000, ranked_games: 0}, {name: Cat, rating: 1000, ranked_games: 0}]
  when:
    - {seat: 3, action: leave_game}
    - {seat: 2, action: leave_game}
  then:
    ratings: {Ann: 1020, Bea: 1000, Cat: 980}

- name: an abandoned game leaves ratings unchanged
  covers: [A10.9, M6.9]
  given:
    turn: 2
    kind: ranked
    players: 3
    seats:
      - seat: 1
        time_bank_ms: 0
        timeouts_in_a_row: 2
      - seat: 2
        time_bank_ms: 0
        timeouts_in_a_row: 2
      - seat: 3
        time_bank_ms: 0
        timeouts_in_a_row: 2
  when:
    - wait_ms: 75000
  then:
    ended: {abandoned: true}
    ratings: unchanged

- name: the game record holds every player's Q T C and F counts
  covers: [A3.2]
  given:
    turn: 40
    seats:
      - seat: 1
        player: Ann
        city: [Orchard, Livestock Farm]
        gained_types: {Sea: 1}
        quests_completed: [Farmland]
        worth_gained: 305
      - seat: 2
        player: Bea
  when:
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    record:
      players:
        - {username: Ann, q: 1, t: 6, c: 0, f: 305}
        - {username: Bea, q: 0, t: 0, c: 0, f: 140}
