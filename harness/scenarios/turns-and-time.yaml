- name: the first player moves one seat on each turn
  covers: [R4.4, R4.5]
  given:
    players: 3
    turn: 4
    phase: market
  then:
    first_player: 1
    market_go: {seat: 1}

- name: the first player in turn 3 of a 3-player game is seat 3
  covers: [R4.4]
  given:
    players: 3
    turn: 3
    phase: market
  then:
    first_player: 3

- name: if the first player has left the next seat still in the game goes first
  covers: [R4.4, M6.6]
  given:
    players: 4
    turn: 6
    phase: market
    seats:
      - seat: 2
        left: true
  then:
    first_player: 3

- name: player order wraps from the highest seat to seat 1 and skips players who left
  covers: [R4.5, R18.6]
  given:
    players: 4
    turn: 4
    phase: market
    seats:
      - seat: 1
        left: true
      - seat: 4
        hand: []
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    random: [{tier: 1}]
  when:
    - {seat: 4, action: turn_draw, option: A, card: Row House}
  then:
    market_go: {seat: 2}

- name: ending the turn marks the player done and further actions are rejected
  covers: [R8.1, R5.2]
  given:
    seats:
      - seat: 1
        hand: [Row House]
  when:
    - {seat: 1, action: end_turn}
    - {seat: 1, action: play_card, card: Row House}
  then:
    rejected: already_done
    seats:
      - seat: 1
        done: true
        hand: [Row House]

- name: the main phase ends only when every player is done
  covers: [R8.2]
  given:
    players: 3
  when:
    - {seat: 1, action: end_turn}
    - {seat: 3, action: end_turn}
  then:
    phase: main
    turn: 1

- name: the order in which players become done is recorded
  covers: [R8.3]
  given:
    players: 3
  when:
    - {seat: 2, action: end_turn}
    - {seat: 1, action: end_turn}
  then:
    done_order: [2, 1]

- name: players made done at the same moment become done in player order
  covers: [R8.4, R9.10]
  given:
    players: 3
    turn: 40
    first_player: 2
    seats:
      - seat: 1
        time_bank_ms: 0
      - seat: 2
        time_bank_ms: 0
      - seat: 3
        time_bank_ms: 0
  when:
    - wait_ms: 75000
  then:
    ended: {places: [2, 3, 1]}

- name: the main-phase time limit in turn 10 is 4 minutes 27 seconds
  covers: [R9.1, R9.5]
  given:
    turn: 10
  when:
    - wait_ms: 266999
  then:
    seats:
      - seat: 1
        done: false
        time_bank_ms: 708001

- name: reaching the main-phase limit makes the player done
  covers: [R9.1, R9.10]
  given:
    kind: ranked
    turn: 10
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
  when:
    - wait_ms: 267000
  then:
    turn: 11
    seats:
      - seat: 1
        time_bank_ms: 708000
        timeouts_in_a_row: 1

- name: the first 75 seconds of a main phase do not use the time bank
  covers: [R9.4, R9.5]
  when:
    - wait_ms: 75000
    - {seat: 1, action: end_turn}
  then:
    seats:
      - seat: 1
        time_bank_ms: 900000

- name: the time bank runs after the free time until the player ends their turn
  covers: [R9.5]
  given:
    turn: 2
  when:
    - wait_ms: 90000
    - {seat: 1, action: end_turn}
    - wait_ms: 30000
  then:
    seats:
      - seat: 1
        time_bank_ms: 885000
        timeouts_in_a_row: 0

- name: with an empty bank a player only has the free time
  covers: [R9.8, R9.10]
  given:
    turn: 2
    seats:
      - seat: 1
        time_bank_ms: 0
  when:
    - wait_ms: 75000
  then:
    seats:
      - seat: 1
        out_of_time: true
        done: false

- name: a player out of time is not made done while another player still has time
  covers: [R9.10]
  given:
    turn: 2
    players: 3
    seats:
      - seat: 1
        time_bank_ms: 0
  when:
    - wait_ms: 75000
    - {seat: 2, action: end_turn}
  then:
    phase: main
    seats:
      - seat: 1
        out_of_time: true
        done: false

- name: a player out of time is made done once every other player is done
  covers: [R9.10, R8.2]
  given:
    turn: 2
    players: 3
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    seats:
      - seat: 1
        time_bank_ms: 0
  when:
    - wait_ms: 75000
    - {seat: 2, action: end_turn}
    - {seat: 3, action: end_turn}
  then:
    turn: 3
    phase: market

- name: a player out of time is made done when the last player with time left runs out too
  covers: [R9.10]
  given:
    turn: 2
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    seats:
      - seat: 1
        time_bank_ms: 0
      - seat: 2
        time_bank_ms: 10000
  when:
    - wait_ms: 85000
  then:
    turn: 3
    phase: market

- name: a main-phase action after the player's time ran out is accepted while another player is still playing
  covers: [R9.6, R9.10]
  given:
    turn: 2
    seats:
      - seat: 1
        time_bank_ms: 0
        hand: [Row House]
  when:
    - {wait_ms: 75000, alarm_fires: false}
    - {seat: 1, action: play_card, card: Row House}
  then:
    seats:
      - seat: 1
        city: [Row House]
        out_of_time: true
        done: false

- name: a message received at the deadline is rejected and the time-out is applied
  covers: [R9.6, R18.11]
  given:
    turn: 2
    phase: market
    first_player: 2
    marketplace: [{place: residential, card: Row House}]
    seats:
      - seat: 2
        time_bank_ms: 0
  when:
    - {wait_ms: 5000, alarm_fires: false}
    - {seat: 2, action: turn_draw, option: A, card: Row House}
  then:
    rejected: out_of_time
    marketplace: [{place: residential, card: Row House}]
    market_go: {seat: 1}
    seats:
      - seat: 2
        market: out
        hand: []
        turn_draw_pending: true

- name: a message received just before the deadline is accepted
  covers: [R9.6]
  given:
    turn: 2
    seats:
      - seat: 1
        time_bank_ms: 0
        hand: [Row House]
  when:
    - wait_ms: 74999
    - {seat: 1, action: play_card, card: Row House}
  then:
    seats:
      - seat: 1
        city: [Row House]
        done: false

- name: banks are shown rounded down to whole seconds
  covers: [R9.7, R9.9]
  given:
    turn: 2
  when:
    - wait_ms: 76500
  then:
    view: {seat: 2, of_seat: 1, time_bank_shown: 898}

- name: every player sees every other player's bank counting down during the main phase
  covers: [R9.9, R5.6]
  given:
    turn: 2
  when:
    - wait_ms: 90000
  then:
    view: {seat: 2, of_seat: 1, time_bank_ms: 885000}

- name: three main-phase time-outs in a row count as leaving the game
  covers: [R9.11, M5.4, M6.10]
  given:
    turn: 2
    kind: ranked
    players: 3
    seats:
      - seat: 1
        time_bank_ms: 0
        timeouts_in_a_row: 2
  when:
    - wait_ms: 75000
  then:
    seats:
      - seat: 1
        left: true

- name: a player whose time runs out is told how many time-outs in a row out of 3
  covers: [R9.11]
  given:
    turn: 2
    kind: ranked
    seats:
      - seat: 1
        time_bank_ms: 0
        timeouts_in_a_row: 1
  when:
    - wait_ms: 75000
  then:
    seats:
      - seat: 1
        out_of_time: true
        timeouts_in_a_row: 2
    message_to: {seat: 1, notice: timed_out, in_a_row: 2, of: 3}

- name: in a casual game time-outs in a row do not count as leaving the game
  covers: [R9.11, M5.4]
  given:
    turn: 2
    players: 3
    seats:
      - seat: 1
        time_bank_ms: 0
        timeouts_in_a_row: 2
  when:
    - wait_ms: 75000
  then:
    seats:
      - seat: 1
        left: false
        out_of_time: true

- name: in a casual game a player whose time runs out is told they can keep playing
  covers: [R9.11]
  given:
    turn: 2
    seats:
      - seat: 1
        time_bank_ms: 0
  when:
    - wait_ms: 75000
  then:
    message_to: {seat: 1, notice: timed_out, keep_playing: true}

- name: ending the turn in time resets the time-out count
  covers: [R9.11]
  given:
    kind: ranked
    seats:
      - seat: 1
        timeouts_in_a_row: 2
  when:
    - {seat: 1, action: end_turn}
  then:
    seats:
      - seat: 1
        timeouts_in_a_row: 0

- name: the first player's market go has 40 seconds
  covers: [R9.2, R18.11]
  given:
    players: 2
    turn: 2
    phase: market
    first_player: 2
  then:
    market_go: {seat: 2, time_left_ms: 40000}

- name: every later market go also has 40 seconds
  covers: [R9.2, R18.11]
  given:
    players: 2
    turn: 2
    phase: market
    first_player: 2
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    random: [{tier: 1}]
  when:
    - {seat: 2, action: turn_draw, option: A, card: Row House}
  then:
    market_go: {seat: 1, time_left_ms: 40000}

- name: a deadline while nobody is connected pauses the game instead
  covers: [R9.12, M5.5]
  given:
    turn: 2
    seats:
      - seat: 1
        time_bank_ms: 0
        connected: false
      - seat: 2
        connected: false
  when:
    - wait_ms: 75000
  then:
    paused: true
    seats:
      - seat: 1
        done: false

- name: a paused game goes on when a player reconnects and the timed-out player gets free time again
  covers: [R9.13]
  given:
    turn: 2
    paused: true
    seats:
      - seat: 1
        time_bank_ms: 0
        connected: false
      - seat: 2
        connected: false
  when:
    - reconnect: 2
    - wait_ms: 74999
  then:
    paused: false
    seats:
      - seat: 1
        out_of_time: false
        time_bank_ms: 0

- name: after the extra free time the paused player times out as normal
  covers: [R9.13, R9.10]
  given:
    turn: 2
    paused: true
    seats:
      - seat: 1
        time_bank_ms: 0
        connected: false
      - seat: 2
        connected: false
  when:
    - reconnect: 2
    - wait_ms: 75000
  then:
    seats:
      - seat: 1
        out_of_time: true

- name: a game paused for 24 hours is abandoned
  covers: [R9.14, A10.9]
  given:
    kind: ranked
    players: 3
    paused: true
    seats:
      - seat: 1
        connected: false
      - seat: 2
        connected: false
      - seat: 3
        connected: false
  when:
    - wait_ms: 86400000
  then:
    ended: {abandoned: true}
    ratings: unchanged

- name: end-of-turn steps pay influence income and bonus and keep build passes
  covers: [R10.1, R10.3, R14.1, R14.3, R2.2]
  given:
    turn: 3
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    seats:
      - seat: 1
        stats: {funds: 5, income: 4, influence: 2, workforce: 2, quality: 1, satisfaction: -1, product: 1, distribution: 2, bonus: 5}
        build_passes: 1
        played_this_turn: true
  when:
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    turn: 4
    seats:
      - seat: 1
        stats: {funds: 10, influence: 3, bonus: 7}
        build_passes: 2
        played_this_turn: false
      - seat: 2
        stats: {funds: 10, influence: 1, bonus: 0}

- name: negative stats lower the bonus and a negative bonus gives no funds
  covers: [R14.2, R14.3]
  given:
    turn: 3
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    seats:
      - seat: 1
        stats: {workforce: -5, quality: 1, satisfaction: 0, bonus: 2}
  when:
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    seats:
      - seat: 1
        stats: {funds: 10, bonus: -2}

- name: every full 10 bonus becomes 1 fund
  covers: [R14.3]
  given:
    turn: 3
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    seats:
      - seat: 1
        stats: {product: 4, bonus: 4}
  when:
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    seats:
      - seat: 1
        stats: {funds: 12, bonus: 0}

- name: players who left get no end-of-turn steps
  covers: [R10.1, M6.4]
  given:
    players: 3
    turn: 3
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    seats:
      - seat: 3
        left: true
        done: true
  when:
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    seats:
      - seat: 3
        stats: {funds: 7, influence: 0}

- name: at the start of a turn old marketplace cards are removed and places refilled in order
  covers: [R11.1, R18.14, R18.13, R18.5]
  given:
    turn: 3
    marketplace: [{place: residential, card: Row House, phases_shown: 2}, {place: industry, card: Metal Mining, phases_shown: 1}, {place: service, card: Liquor Shop, phases_shown: 2}, {place: public_quality, card: Fire Station, phases_shown: 1}, {place: public_satisfaction, card: Public Playground, phases_shown: 1}, {place: open_1, card: Dentist, phases_shown: 2}, {place: open_2, card: Apparel Store, phases_shown: 1}, {place: open_3, card: Forest Plantation, phases_shown: 1}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    random: [{tier: 1}, {tier: 1}, {sector: Public}, {tier: 1}]
  when:
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    turn: 4
    phase: market
    discard: [Row House, Liquor Shop, Dentist]
    marketplace:
      - {place: residential, card: Farm House}
      - {place: industry, card: Metal Mining}
      - {place: service, card: Fast Food Restaurant}
      - {place: public_quality, card: Fire Station}
      - {place: public_satisfaction, card: Public Playground}
      - {place: open_1, card: Landfill}
      - {place: open_2, card: Apparel Store}
      - {place: open_3, card: Forest Plantation}

- name: a 5th quest place is added and filled at the start of turn 20
  covers: [R11.2, R19.1]
  given:
    turn: 19
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    random: [{tier: 2}, {quest: Safe streets}]
  when:
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    turn: 20
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}, {quest: Safe streets, turns_on_table: 1}]

- name: the market phase follows the start-of-turn steps
  covers: [R11.3, R4.1]
  given:
    turn: 1
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
  when:
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    turn: 2
    phase: market
    first_player: 2
    market_go: {seat: 2}

- name: skip build is reset at the end of the turn
  covers: [R10.1]
  given:
    turn: 3
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    seats:
      - seat: 1
        skipped_build: true
        build_passes: 1
  when:
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    seats:
      - seat: 1
        skipped_build: false
        build_passes: 1

- name: a market go can be paused and the player gets their free time again
  covers: [R9.12, R9.13]
  given:
    turn: 2
    phase: market
    first_player: 2
    marketplace: [{place: residential, card: Row House}]
    seats:
      - seat: 1
        connected: false
      - seat: 2
        time_bank_ms: 0
        connected: false
  when:
    - wait_ms: 5000
    - reconnect: 1
    - wait_ms: 4999
  then:
    paused: false
    market_go: {seat: 2}

- name: when two players' time would run out together while nobody is connected both get their free time again
  covers: [R9.12, R9.13]
  given:
    turn: 2
    seats:
      - seat: 1
        time_bank_ms: 0
        connected: false
      - seat: 2
        time_bank_ms: 0
        connected: false
  when:
    - wait_ms: 75000
    - reconnect: 1
    - wait_ms: 74999
  then:
    paused: false
    seats:
      - seat: 1
        out_of_time: false
      - seat: 2
        out_of_time: false

- name: a paused player's bank used before the pause stays used
  covers: [R9.8, R9.12, R9.13]
  given:
    turn: 2
    seats:
      - seat: 1
        time_bank_ms: 30000
        connected: false
      - seat: 2
        time_bank_ms: 30000
        connected: false
  when:
    - wait_ms: 105000
    - reconnect: 1
    - {seat: 1, action: end_turn}
  then:
    seats:
      - seat: 1
        done: true
        time_bank_ms: 0

- name: every player gets 1 build pass at the start of every turn
  covers: [R6.3, R11.4]
  given:
    turn: 3
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    seats:
      - seat: 1
        build_passes: 0
        played_this_turn: true
  when:
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    turn: 4
    seats:
      - seat: 1
        build_passes: 1
      - seat: 2
        build_passes: 2

- name: unused build passes carry over to later turns with no limit
  covers: [R6.3, R10.1]
  given:
    turn: 3
    marketplace: [{place: residential, card: Row House}, {place: industry, card: Metal Mining}, {place: service, card: Liquor Shop}, {place: public_quality, card: Fire Station}, {place: public_satisfaction, card: Public Playground}, {place: open_1, card: Dentist}, {place: open_2, card: Apparel Store}, {place: open_3, card: Forest Plantation}]
    quests: [{quest: Farmland}, {quest: Sports town}, {quest: Trading post}, {quest: Mining town}]
    seats:
      - seat: 1
        build_passes: 7
  when:
    - {seat: 1, action: end_turn}
    - {seat: 2, action: end_turn}
  then:
    seats:
      - seat: 1
        build_passes: 8

- name: the main-phase time limit in turn 1 is 5 minutes
  covers: [R9.1, R9.4, R9.5]
  when:
    - wait_ms: 299999
  then:
    seats:
      - seat: 1
        done: false
        time_bank_ms: 765001

- name: the first 165 seconds of the main phase in turn 1 do not use the time bank
  covers: [R9.4, R9.5]
  when:
    - wait_ms: 165000
    - {seat: 1, action: end_turn}
  then:
    seats:
      - seat: 1
        time_bank_ms: 900000

- name: unused free time is added to the time bank when the player ends their turn
  covers: [R9.15]
  given:
    turn: 2
    seats:
      - seat: 1
        time_bank_ms: 600000
  when:
    - wait_ms: 30000
    - {seat: 1, action: end_turn}
  then:
    seats:
      - seat: 1
        time_bank_ms: 645000

- name: unused free time of turn 1 is added to the time bank
  covers: [R9.15, R9.4]
  given:
    seats:
      - seat: 1
        time_bank_ms: 600000
  when:
    - wait_ms: 65000
    - {seat: 1, action: end_turn}
  then:
    seats:
      - seat: 1
        time_bank_ms: 700000

- name: the time bank never grows above 15 minutes
  covers: [R9.15, R9.3]
  given:
    turn: 2
    seats:
      - seat: 1
        time_bank_ms: 890000
  when:
    - {seat: 1, action: end_turn}
  then:
    seats:
      - seat: 1
        time_bank_ms: 900000

- name: free time given again after a pause is not added to the time bank
  covers: [R9.15, R9.13]
  given:
    turn: 2
    seats:
      - seat: 1
        time_bank_ms: 0
        connected: false
      - seat: 2
        connected: false
  when:
    - wait_ms: 75000
    - reconnect: 1
    - {seat: 1, action: end_turn}
  then:
    seats:
      - seat: 1
        done: true
        time_bank_ms: 0
